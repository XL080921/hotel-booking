<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏨 悦居 - 酒店预订系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-logo">🏨 悦居酒店预订</div>
            <div class="nav-links">
                <button class="nav-link active" id="nav-user" onclick="switchView('user')">🛏️ 用户端</button>
                <button class="nav-link" id="nav-admin" onclick="switchView('admin')">⚙️ 管理端</button>
            </div>
        </div>
    </nav>

    <!-- Toast 通知 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 用户端页面 -->
    <div class="page active" id="page-user"></div>

    <!-- 管理端页面 -->
    <div class="page" id="page-admin"></div>

    <!-- 图片灯箱 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <span style="position:absolute;left:20px;color:#fff;font-size:2rem;cursor:pointer;user-select:none" onclick="prevLightbox(event)">‹</span>
        <img id="lightbox-img" src="" alt="酒店图片">
        <span style="position:absolute;right:20px;color:#fff;font-size:2rem;cursor:pointer;user-select:none" onclick="nextLightbox(event)">›</span>
    </div>

    <!-- 管理端模态框 -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 class="modal-title">添加酒店</h3>
            <div class="modal-body"></div>
            <div class="btn-row">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveHotel()">保存</button>
            </div>
        </div>
    </div>


    <!-- 登录注册弹窗 -->
    <div class="auth-overlay" id="auth-overlay" onclick="closeAuthOverlay()">
        <div class="auth-card" id="auth-card" onclick="event.stopPropagation()"></div>
    </div>
    <!-- 脚本 -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
